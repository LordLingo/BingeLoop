kind = "web"
previewPath = "/"
title = "BingeLoop"
version = "1.0.0"
id = "artifacts/watchlist"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26208

[services.development]
run = "pnpm --filter @workspace/watchlist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/watchlist", "run", "build" ]
publicDir = "artifacts/watchlist/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26208"
BASE_PATH = "/"

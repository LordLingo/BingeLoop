openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Watchlist entry operations
  - name: watchlist
    description: Personal watchlist (saved shows) operations
  - name: audiences
    description: Per-member "Who Should Watch?" audience picks per show
  - name: spice
    description: Per-member "Spicy?" (adult content) flags per show
  - name: comments
    description: Threaded per-show discussion among group members
  - name: invites
    description: Shareable invite links to join a group
  - name: groups
    description: User-created named groups
  - name: activity
    description: New-activity check-in
  - name: topFour
    description: Member Top Four favorites
  - name: reactions
    description: Lightweight emoji reactions on entries and comments
  - name: lists
    description: Member-curated named lists of movies and shows
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List watchlist entries
      description: By default returns only your own entries across all your groups. Pass groupId to scope to entries that were added to that specific group (you must be a member). Pass userId to view a single member's entries across all groups (only allowed when you share a group). Pass unassigned=true to list your own entries that have not yet been assigned to any group.
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's entries across all groups. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Scope the list to entries added to this group. You must be a member.
          schema:
            type: integer
        - name: unassigned
          in: query
          required: false
          description: When true, returns only your own entries that have no group assigned yet.
          schema:
            type: boolean
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, rating_high, rating_low, title]
      responses:
        "200":
          description: A list of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a watchlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stats:
    get:
      operationId: getStats
      tags: [entries]
      summary: Watchlist summary stats
      description: Aggregate counts, average rating, and category breakdown. Pass groupId to aggregate across entries added to that group (you must be a member), or userId for a single member's stats across all groups (only allowed when you share a group). With neither, aggregates only your own entries across all your groups.
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's stats instead of the group's. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Aggregate stats across members of this group. You must be a member.
          schema:
            type: integer
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
  /categories:
    get:
      operationId: listCategories
      tags: [entries]
      summary: List available categories
      description: Returns the canonical list of categories that can be assigned to entries.
      responses:
        "200":
          description: A list of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /tmdb/search:
    get:
      operationId: tmdbSearch
      tags: [tmdb]
      summary: Search TMDB for movies and TV shows
      description: Proxies TMDB search/multi (movies and TV only). Used to pick a show when logging an entry.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TmdbSearchResult"
  /tmdb/details:
    get:
      operationId: tmdbDetails
      tags: [tmdb]
      summary: Get streaming provider and network for a TMDB show
      description: Returns the US streaming provider (watch/providers) and, for TV, the network name.
      parameters:
        - name: tmdbId
          in: query
          required: true
          schema:
            type: integer
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
      responses:
        "200":
          description: Streaming and network details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbDetails"
  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List my saved watchlist items
      description: >-
        Returns the caller's saved shows by default, each annotated with the
        names of other members of the given group who have rated or saved the
        same show. Pass userId to view another member's saved shows (requires a
        shared group).
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's saved shows instead of your own. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Scope the "also engaged by" names to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: A list of saved watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: createWatchlistItem
      tags: [watchlist]
      summary: Save a show to my watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
  /watchlist/{id}:
    delete:
      operationId: deleteWatchlistItem
      tags: [watchlist]
      summary: Remove a show from my watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /audiences:
    get:
      operationId: listAudiences
      tags: [audiences]
      summary: List "Who Should Watch?" summaries
      description: >-
        Returns, for every show that has at least one pick within the given
        group, the count of members who chose each audience plus the caller's
        own picks. Without a groupId, only the caller's own picks are counted.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Audience summaries by show
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowAudience"
    put:
      operationId: setAudiences
      tags: [audiences]
      summary: Set my "Who Should Watch?" picks for a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudienceInput"
      responses:
        "200":
          description: Updated audience summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowAudience"
    delete:
      operationId: clearAudiences
      tags: [audiences]
      summary: Clear my audience picks for a show
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: groupId
          in: query
          required: false
          description: Scope the returned tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Updated audience summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowAudience"
  /spice:
    get:
      operationId: listSpice
      tags: [spice]
      summary: List "Spicy?" summaries
      description: >-
        Returns, for every show that has at least one answer within the given
        group, the count of each answer across that group's members plus the
        caller's own answer. Without a groupId, only the caller's own answers
        are counted.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Spicy summaries by show
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowSpicy"
    put:
      operationId: setSpicy
      tags: [spice]
      summary: Set my "Spicy?" answer for a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpicyInput"
      responses:
        "200":
          description: Updated spicy summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowSpicy"
    delete:
      operationId: clearSpicy
      tags: [spice]
      summary: Clear my spicy answer for a show
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: groupId
          in: query
          required: false
          description: Scope the returned tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Updated spicy summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowSpicy"
  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List the discussion for a show
      description: >-
        Returns the flat list of comments for a show (matched by normalized
        title + mediaType) authored by members of the given group, oldest
        first. Replies reference their parent via parentId; clients nest them.
        Without a groupId, only the caller's own comments are returned.
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: groupId
          in: query
          required: false
          description: Scope the thread to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Comments for the show, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment or reply on a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: The created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /activity/check-in:
    post:
      operationId: checkIn
      tags: [activity]
      summary: Record a visit and get new-activity count
      description: >-
        Records the caller's visit, returning the number of entries added by
        other members of the given group since the caller's previous visit.
        Updates the stored last-seen time to now. Without a groupId, newCount is
        always 0.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Count new entries from other members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: New-activity summary since the previous visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
  /activity/feed:
    get:
      operationId: listActivityFeed
      tags: [activity]
      summary: Combined recent activity from group members
      description: >-
        Returns a reverse-chronological feed of recent actions (ratings,
        watchlist saves, comments, "Who Should Watch?" and Spicy answers) by
        members of the given group. Without a groupId, only the caller's own
        activity is returned. Returns 403 if the caller passed a group they
        are not a member of.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the feed to members of this group.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (default 50, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent activity, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "403":
          description: Caller is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activity/digest:
    get:
      operationId: getWeeklyDigest
      tags: [activity]
      summary: Weekly digest for a group
      description: >-
        Returns a summary of the last 7 days for the given group: counts of new
        ratings, comments and watchlist saves, the week's top-rated pick, and
        the most active member. Without a groupId, only the caller's own
        activity is summarized. Returns 403 if the caller passed a group they
        are not a member of.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the digest to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Weekly digest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyDigest"
        "403":
          description: Caller is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reactions:
    get:
      operationId: listReactions
      tags: [reactions]
      summary: List emoji reaction summaries
      description: >-
        Returns, for every entry or comment that has at least one reaction from
        a member of the given group, the per-emoji counts plus the caller's own
        reactions. Without a groupId, only the caller's own reactions are
        counted. Returns 403 if the caller passed a group they are not a member
        of.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the reactions to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Reaction summaries by target
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReactionSummary"
        "403":
          description: Caller is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: toggleReaction
      tags: [reactions]
      summary: Toggle my emoji reaction on a target
      description: >-
        Adds the emoji reaction for the caller on the target if absent, or
        removes it if already present. Returns the updated reaction summary for
        that target. Returns 403 if the caller passed a group they are not a
        member of, or 400 if the target is not visible to the group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated reaction summary for the target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
        "400":
          description: Invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /top-four:
    get:
      operationId: listTopFour
      tags: [topFour]
      summary: Get a member's Top Four favorites
      description: >-
        Returns the caller's own Top Four picks by default, ordered by position.
        Pass userId to view another member's picks (requires a shared group).
        The list has 0-4 items.
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's Top Four instead of your own. Requires a shared group.
          schema:
            type: string
      responses:
        "200":
          description: The member's Top Four picks, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopFourPick"
        "403":
          description: Caller does not share a group with the target user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setTopFour
      tags: [topFour]
      summary: Replace my Top Four favorites
      description: >-
        Replaces the caller's entire Top Four with the given ordered list (0-4
        picks). Titles are free-text and need not be logged in the app. Returns
        the saved list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopFourInput"
      responses:
        "200":
          description: The saved Top Four picks, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopFourPick"
  /lists:
    get:
      operationId: listLists
      tags: [lists]
      summary: Browse lists in a group
      description: >-
        Returns lists owned by members of the given group (you must be a
        member). Without groupId, returns only your own lists. Each summary
        includes the owner's name and item count.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Browse lists owned by all members of this group. Requires membership.
          schema:
            type: integer
      responses:
        "200":
          description: The lists, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListSummary"
        "403":
          description: Caller is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createList
      tags: [lists]
      summary: Create a new list
      description: Creates a list owned by the caller, with a title and optional description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListInput"
      responses:
        "201":
          description: The created list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
  /lists/{id}:
    get:
      operationId: getList
      tags: [lists]
      summary: Open a list and see its contents
      description: >-
        Returns the list with its items. You must share a group with the list's
        owner (or be the owner), otherwise 403.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The list and its items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDetail"
        "403":
          description: Caller does not share a group with the list owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: List not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateList
      tags: [lists]
      summary: Edit a list's title or description
      description: Owner-only. Updates the list's name and/or description.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListInput"
      responses:
        "200":
          description: The updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSummary"
        "403":
          description: Caller does not own this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: List not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteList
      tags: [lists]
      summary: Delete a list
      description: Owner-only. Deletes the list and all its items.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller does not own this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: List not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lists/{id}/items:
    post:
      operationId: addListItem
      tags: [lists]
      summary: Add a movie or show to a list
      description: Owner-only. Appends a free-text title to the list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddListItemInput"
      responses:
        "201":
          description: The added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "403":
          description: Caller does not own this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: List not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lists/{id}/items/{itemId}:
    delete:
      operationId: deleteListItem
      tags: [lists]
      summary: Remove a movie or show from a list
      description: Owner-only. Removes one item from the list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Caller does not own this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: List or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List the groups I belong to
      responses:
        "200":
          description: The caller's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group's details and members
      description: Only members of the group may read it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: renameGroup
      tags: [groups]
      summary: Rename a group (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/leave:
    post:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group
      description: >-
        Removes the caller from the group. If the owner leaves, ownership passes
        to the longest-standing remaining member; if no members remain, the
        group is deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/members/{userId}:
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a member from a group (owner only)
      description: >-
        Revokes the target member's access to the group: they can no longer view
        or switch to it. The member's contributed content (entries, ratings,
        comments, watchlist, Top Four, lists, audience/spice picks) is kept and
        stays visible to the rest of the group, with their name as the original
        contributor. Only the group owner may call this, and the owner cannot
        remove themselves.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot remove yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/invite:
    post:
      operationId: createOrGetGroupInvite
      tags: [invites]
      summary: Create or fetch the group's shareable invite link
      description: >-
        Returns the group's reusable invite link, creating one on first call.
        Only members may generate it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The group's invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "403":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites/{token}:
    get:
      operationId: getInvitePreview
      tags: [invites]
      summary: Look up an invite by token (public)
      description: >-
        Public endpoint used by the invite landing page to show which group the
        visitor is being invited to before they sign up. Returns valid=false for
        unknown tokens.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invite after signing in
      description: >-
        Adds the authenticated caller to the invite's group. Idempotent;
        accepting when already a member is a no-op.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acceptance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResult"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the caller's display-name profile
      description: >-
        Returns the authenticated caller's chosen display name, or null if they
        have not set one yet (in which case the client must prompt for one).
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Set or change the caller's display name
      description: >-
        Sets the caller's global display name and propagates it everywhere they
        appear. Rejects blank names (400) and names already taken by another
        member in one of the caller's groups (409, code "name_taken").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Blank or invalid display name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already taken in a group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Profile:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          nullable: true
          description: The caller's chosen display name, or null if not set yet.
    ProfileUpdate:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: The desired display name (trimmed; must be non-blank).
    Invite:
      type: object
      required:
        - token
        - groupId
        - groupName
        - createdAt
      properties:
        token:
          type: string
        groupId:
          type: integer
        groupName:
          type: string
        createdAt:
          type: string
          format: date-time
    InvitePreview:
      type: object
      required:
        - token
        - groupName
        - inviterName
        - valid
      properties:
        token:
          type: string
        groupName:
          type: string
        inviterName:
          type: string
        valid:
          type: boolean
    AcceptInviteResult:
      type: object
      required:
        - joined
        - groupId
        - groupName
      properties:
        joined:
          type: boolean
        groupId:
          type: ["integer", "null"]
        groupName:
          type: string
    GroupInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    Group:
      type: object
      required:
        - id
        - name
        - ownerId
        - role
        - memberCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: string
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    GroupMember:
      type: object
      required:
        - userId
        - displayName
        - role
        - joinedAt
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time
    GroupDetail:
      type: object
      required:
        - id
        - name
        - ownerId
        - role
        - memberCount
        - createdAt
        - members
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: string
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
    MediaType:
      type: string
      enum: [movie, tv]
    Entry:
      type: object
      required:
        - id
        - title
        - mediaType
        - rating
        - category
        - addedBy
        - addedById
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
        comment:
          type: ["string", "null"]
        addedBy:
          type: string
          description: Display name of the user who added this entry.
        addedById:
          type: string
          description: User id of the member who added this entry (for linking to their profile).
        tmdbId:
          type: ["integer", "null"]
          description: TMDB id of the selected show.
        posterPath:
          type: ["string", "null"]
          description: TMDB poster path (e.g. /abc.jpg).
        streamingProvider:
          type: ["string", "null"]
          description: US streaming service name from TMDB watch/providers.
        streamingLogo:
          type: ["string", "null"]
          description: TMDB logo path for the streaming provider.
        network:
          type: ["string", "null"]
          description: Network name (TV shows only).
        groupId:
          type: ["integer", "null"]
          description: The group this entry was added to. Null means it has not been assigned to a group yet.
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required:
        - title
        - mediaType
        - rating
        - category
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: string
        tmdbId:
          type: ["integer", "null"]
        posterPath:
          type: ["string", "null"]
        streamingProvider:
          type: ["string", "null"]
        streamingLogo:
          type: ["string", "null"]
        network:
          type: ["string", "null"]
        groupId:
          type: ["integer", "null"]
          description: The group to add this entry to. Defaults to null (unassigned) when omitted.
    EntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: ["string", "null"]
        tmdbId:
          type: ["integer", "null"]
        posterPath:
          type: ["string", "null"]
        streamingProvider:
          type: ["string", "null"]
        streamingLogo:
          type: ["string", "null"]
        network:
          type: ["string", "null"]
        groupId:
          type: ["integer", "null"]
          description: Reassign this entry to a group. Used to assign previously unassigned entries.
    TmdbSearchResult:
      type: object
      required:
        - tmdbId
        - mediaType
        - title
      properties:
        tmdbId:
          type: integer
        mediaType:
          $ref: "#/components/schemas/MediaType"
        title:
          type: string
        year:
          type: ["string", "null"]
        posterPath:
          type: ["string", "null"]
    TmdbDetails:
      type: object
      properties:
        streamingProvider:
          type: ["string", "null"]
        streamingLogo:
          type: ["string", "null"]
        network:
          type: ["string", "null"]
    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer
    Stats:
      type: object
      required:
        - total
        - movieCount
        - tvCount
        - averageRating
        - byCategory
      properties:
        total:
          type: integer
        movieCount:
          type: integer
        tvCount:
          type: integer
        averageRating:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    WatchlistItem:
      type: object
      required:
        - id
        - title
        - mediaType
        - createdAt
        - alsoEngagedBy
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        createdAt:
          type: string
          format: date-time
        alsoEngagedBy:
          type: array
          description: Display names of other group members who rated or saved this show.
          items:
            type: string
    WatchlistInput:
      type: object
      required:
        - title
        - mediaType
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
    Audience:
      type: string
      description: Which audience a show suits.
      enum: [girls, guys, couples, solo]
    ShowAudience:
      type: object
      required:
        - titleKey
        - mediaType
        - girls
        - guys
        - couples
        - solo
        - myAudiences
      properties:
        titleKey:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        girls:
          type: integer
          description: Number of members who picked "The Girls".
        guys:
          type: integer
          description: Number of members who picked "The Guys".
        couples:
          type: integer
          description: Number of members who picked "Couples".
        solo:
          type: integer
          description: Number of members who picked "Solo".
        myAudiences:
          description: The current user's own picks (may be empty).
          type: array
          items:
            $ref: "#/components/schemas/Audience"
    AudienceInput:
      type: object
      required:
        - title
        - mediaType
        - audiences
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        audiences:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Audience"
        groupId:
          type: integer
          description: >-
            Scope the returned tallies to members of this group. Without it,
            only the caller's own picks are counted.
    Spicy:
      type: string
      description: >-
        Maturity level for a show: mild (1 pepper), mature (2 peppers, 17+),
        adult (3 peppers, adults only).
      enum: [mild, mature, adult]
    ShowSpicy:
      type: object
      required:
        - titleKey
        - mediaType
        - mild
        - mature
        - adult
        - mySpicy
      properties:
        titleKey:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        mild:
          type: integer
        mature:
          type: integer
        adult:
          type: integer
        mySpicy:
          description: The current user's own answer, or null if they haven't answered.
          anyOf:
            - $ref: "#/components/schemas/Spicy"
            - type: "null"
    SpicyInput:
      type: object
      required:
        - title
        - mediaType
        - spicy
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        spicy:
          $ref: "#/components/schemas/Spicy"
        groupId:
          type: integer
          description: >-
            Scope the returned tallies to members of this group. Without it,
            only the caller's own answer is counted.
    ReactionEmoji:
      type: string
      enum: ["👍", "👎"]
    ReactionTargetType:
      type: string
      enum: [entry, comment]
    ReactionCount:
      type: object
      required:
        - emoji
        - count
      properties:
        emoji:
          $ref: "#/components/schemas/ReactionEmoji"
        count:
          type: integer
    ReactionSummary:
      type: object
      required:
        - targetType
        - targetId
        - emojis
        - mine
      properties:
        targetType:
          $ref: "#/components/schemas/ReactionTargetType"
        targetId:
          type: integer
        emojis:
          type: array
          description: Per-emoji counts across the group, only for emojis with at least one reaction.
          items:
            $ref: "#/components/schemas/ReactionCount"
        mine:
          type: array
          description: The emojis the current user has reacted with on this target.
          items:
            $ref: "#/components/schemas/ReactionEmoji"
    ReactionInput:
      type: object
      required:
        - targetType
        - targetId
        - emoji
      properties:
        targetType:
          $ref: "#/components/schemas/ReactionTargetType"
        targetId:
          type: integer
        emoji:
          $ref: "#/components/schemas/ReactionEmoji"
        groupId:
          type: integer
          description: >-
            Scope the returned summary to members of this group. Without it,
            only the caller's own reactions are counted.
    WeeklyDigest:
      type: object
      required:
        - since
        - newRatings
        - newComments
        - newSaves
        - topShow
        - mostActive
      properties:
        since:
          type: string
          format: date-time
          description: Start of the digest window (7 days ago).
        newRatings:
          type: integer
        newComments:
          type: integer
        newSaves:
          type: integer
        topShow:
          description: The week's highest-rated new entry, or null if there were none.
          anyOf:
            - $ref: "#/components/schemas/DigestTopShow"
            - type: "null"
        mostActive:
          description: The member with the most actions this week, or null if there were none.
          anyOf:
            - $ref: "#/components/schemas/DigestMostActive"
            - type: "null"
    DigestTopShow:
      type: object
      required:
        - title
        - mediaType
        - rating
        - addedBy
        - entryId
      properties:
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
        addedBy:
          type: string
        entryId:
          type: integer
    DigestMostActive:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
        count:
          type: integer
    Comment:
      type: object
      required:
        - id
        - parentId
        - authorName
        - body
        - createdAt
      properties:
        id:
          type: integer
        parentId:
          description: The id of the comment this is a reply to, or null for a top-level comment.
          anyOf:
            - type: integer
            - type: "null"
        authorName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    CommentInput:
      type: object
      required:
        - title
        - mediaType
        - body
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        body:
          type: string
          minLength: 1
        parentId:
          type: integer
          description: When replying to a specific comment, its id.
        groupId:
          type: integer
          description: >-
            Authorize and scope the thread against members of this group.
            Without it, only the caller's own comments are visible.
    CheckInResult:
      type: object
      required:
        - newCount
        - since
      properties:
        newCount:
          type: integer
          description: Entries added by other group members since the previous visit.
        since:
          type: ["string", "null"]
          format: date-time
          description: The previous last-seen time, or null on first visit.
    TopFourPick:
      type: object
      required:
        - position
        - title
        - mediaType
      properties:
        position:
          type: integer
          description: Zero-based slot (0-3) determining display order.
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
    TopFourPickInput:
      type: object
      required:
        - title
        - mediaType
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        mediaType:
          $ref: "#/components/schemas/MediaType"
    TopFourInput:
      type: object
      required:
        - picks
      properties:
        picks:
          type: array
          maxItems: 4
          description: The ordered favorites; the first item is shown first.
          items:
            $ref: "#/components/schemas/TopFourPickInput"
    ListSummary:
      type: object
      required:
        - id
        - name
        - description
        - ownerId
        - ownerName
        - itemCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        ownerName:
          type: string
          description: Display-name snapshot of the member who created the list.
        itemCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    ListItem:
      type: object
      required:
        - id
        - title
        - mediaType
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
    ListDetail:
      type: object
      required:
        - id
        - name
        - description
        - ownerId
        - ownerName
        - createdAt
        - items
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        ownerName:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
    CreateListInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
    UpdateListInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
          nullable: true
    AddListItemInput:
      type: object
      required:
        - title
        - mediaType
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        mediaType:
          $ref: "#/components/schemas/MediaType"
    ActivityType:
      type: string
      enum: [rating, watchlist, comment, audience, spice]
    ActivityItem:
      type: object
      required:
        - id
        - type
        - actorName
        - title
        - mediaType
        - createdAt
        - entryId
        - rating
        - audiences
        - spicy
      properties:
        id:
          type: string
          description: Stable composite key for this event, e.g. "rating:123".
        type:
          $ref: "#/components/schemas/ActivityType"
        actorName:
          type: string
          description: Display name of the member who performed the action.
        title:
          type: string
          description: Display title of the show the action is about.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        createdAt:
          type: string
          format: date-time
        entryId:
          description: An entry id for this show to open, or null if none is visible to the caller.
          anyOf:
            - type: integer
            - type: "null"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Watchlist entry operations
  - name: watchlist
    description: Personal watchlist (saved shows) operations
  - name: approvals
    description: Per-member "Wife Approved?" answers per show
  - name: spice
    description: Per-member "Spicy?" (adult content) flags per show
  - name: invites
    description: Shareable invite links to join a group
  - name: groups
    description: User-created named groups
  - name: activity
    description: New-activity check-in
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List watchlist entries
      description: Returns entries from members of the active group by default. Pass groupId to scope to a specific group (you must be a member), or userId to view a single member's entries (only allowed when you share a group). With neither, returns entries from everyone who shares a group with you.
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's entries instead of the group's. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Scope the list to members of this group. You must be a member.
          schema:
            type: integer
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, rating_high, rating_low, title]
      responses:
        "200":
          description: A list of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a watchlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stats:
    get:
      operationId: getStats
      tags: [entries]
      summary: Watchlist summary stats
      description: Aggregate counts, average rating, and category breakdown. Pass groupId to aggregate across all members of a group (you must be a member), or userId for a single member's stats (only allowed when you share a group). With neither, aggregates across everyone who shares a group with you.
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's stats instead of the group's. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Aggregate stats across members of this group. You must be a member.
          schema:
            type: integer
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
  /categories:
    get:
      operationId: listCategories
      tags: [entries]
      summary: List available categories
      description: Returns the canonical list of categories that can be assigned to entries.
      responses:
        "200":
          description: A list of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List my saved watchlist items
      description: >-
        Returns the caller's saved shows by default, each annotated with the
        names of other members of the given group who have rated or saved the
        same show. Pass userId to view another member's saved shows (requires a
        shared group).
      parameters:
        - name: userId
          in: query
          required: false
          description: View this member's saved shows instead of your own. Requires a shared group.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Scope the "also engaged by" names to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: A list of saved watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: createWatchlistItem
      tags: [watchlist]
      summary: Save a show to my watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
  /watchlist/{id}:
    delete:
      operationId: deleteWatchlistItem
      tags: [watchlist]
      summary: Remove a show from my watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List "Wife Approved?" summaries
      description: >-
        Returns, for every show that has at least one answer within the given
        group, the count of each answer across that group's members plus the
        caller's own answer. Without a groupId, only the caller's own answers
        are counted.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Approval summaries by show
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowApproval"
    put:
      operationId: setApproval
      tags: [approvals]
      summary: Set my "Wife Approved?" answer for a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Updated approval summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowApproval"
    delete:
      operationId: clearApproval
      tags: [approvals]
      summary: Clear my answer for a show
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: groupId
          in: query
          required: false
          description: Scope the returned tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Updated approval summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowApproval"
  /spice:
    get:
      operationId: listSpice
      tags: [spice]
      summary: List "Spicy?" summaries
      description: >-
        Returns, for every show that has at least one answer within the given
        group, the count of each answer across that group's members plus the
        caller's own answer. Without a groupId, only the caller's own answers
        are counted.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Scope the tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Spicy summaries by show
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowSpicy"
    put:
      operationId: setSpicy
      tags: [spice]
      summary: Set my "Spicy?" answer for a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpicyInput"
      responses:
        "200":
          description: Updated spicy summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowSpicy"
    delete:
      operationId: clearSpicy
      tags: [spice]
      summary: Clear my spicy answer for a show
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: groupId
          in: query
          required: false
          description: Scope the returned tallies to members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: Updated spicy summary for the show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowSpicy"
  /activity/check-in:
    post:
      operationId: checkIn
      tags: [activity]
      summary: Record a visit and get new-activity count
      description: >-
        Records the caller's visit, returning the number of entries added by
        other members of the given group since the caller's previous visit.
        Updates the stored last-seen time to now. Without a groupId, newCount is
        always 0.
      parameters:
        - name: groupId
          in: query
          required: false
          description: Count new entries from other members of this group.
          schema:
            type: integer
      responses:
        "200":
          description: New-activity summary since the previous visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List the groups I belong to
      responses:
        "200":
          description: The caller's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group's details and members
      description: Only members of the group may read it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: renameGroup
      tags: [groups]
      summary: Rename a group (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/leave:
    post:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group
      description: >-
        Removes the caller from the group. If the owner leaves, ownership passes
        to the longest-standing remaining member; if no members remain, the
        group is deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/invite:
    post:
      operationId: createOrGetGroupInvite
      tags: [invites]
      summary: Create or fetch the group's shareable invite link
      description: >-
        Returns the group's reusable invite link, creating one on first call.
        Only members may generate it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The group's invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "403":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites/{token}:
    get:
      operationId: getInvitePreview
      tags: [invites]
      summary: Look up an invite by token (public)
      description: >-
        Public endpoint used by the invite landing page to show which group the
        visitor is being invited to before they sign up. Returns valid=false for
        unknown tokens.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invite after signing in
      description: >-
        Adds the authenticated caller to the invite's group. Idempotent;
        accepting when already a member is a no-op.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acceptance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResult"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Invite:
      type: object
      required:
        - token
        - groupId
        - groupName
        - createdAt
      properties:
        token:
          type: string
        groupId:
          type: integer
        groupName:
          type: string
        createdAt:
          type: string
          format: date-time
    InvitePreview:
      type: object
      required:
        - token
        - groupName
        - inviterName
        - valid
      properties:
        token:
          type: string
        groupName:
          type: string
        inviterName:
          type: string
        valid:
          type: boolean
    AcceptInviteResult:
      type: object
      required:
        - joined
        - groupId
        - groupName
      properties:
        joined:
          type: boolean
        groupId:
          type: ["integer", "null"]
        groupName:
          type: string
    GroupInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    Group:
      type: object
      required:
        - id
        - name
        - ownerId
        - role
        - memberCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: string
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    GroupMember:
      type: object
      required:
        - userId
        - displayName
        - role
        - joinedAt
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time
    GroupDetail:
      type: object
      required:
        - id
        - name
        - ownerId
        - role
        - memberCount
        - createdAt
        - members
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: string
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
    MediaType:
      type: string
      enum: [movie, tv]
    Entry:
      type: object
      required:
        - id
        - title
        - mediaType
        - rating
        - category
        - addedBy
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
        comment:
          type: ["string", "null"]
        addedBy:
          type: string
          description: Display name of the user who added this entry.
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required:
        - title
        - mediaType
        - rating
        - category
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: string
    EntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: ["string", "null"]
    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer
    Stats:
      type: object
      required:
        - total
        - movieCount
        - tvCount
        - averageRating
        - byCategory
      properties:
        total:
          type: integer
        movieCount:
          type: integer
        tvCount:
          type: integer
        averageRating:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    WatchlistItem:
      type: object
      required:
        - id
        - title
        - mediaType
        - createdAt
        - alsoEngagedBy
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        createdAt:
          type: string
          format: date-time
        alsoEngagedBy:
          type: array
          description: Display names of other group members who rated or saved this show.
          items:
            type: string
    WatchlistInput:
      type: object
      required:
        - title
        - mediaType
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
    Approval:
      type: string
      enum: [yes, no, solo]
    ShowApproval:
      type: object
      required:
        - titleKey
        - mediaType
        - "yes"
        - "no"
        - solo
        - myApproval
      properties:
        titleKey:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        "yes":
          type: integer
        "no":
          type: integer
        solo:
          type: integer
        myApproval:
          description: The current user's own answer, or null if they haven't answered.
          anyOf:
            - $ref: "#/components/schemas/Approval"
            - type: "null"
    ApprovalInput:
      type: object
      required:
        - title
        - mediaType
        - approval
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        approval:
          $ref: "#/components/schemas/Approval"
        groupId:
          type: integer
          description: >-
            Scope the returned tallies to members of this group. Without it,
            only the caller's own answer is counted.
    Spicy:
      type: string
      enum: [yes, no]
    ShowSpicy:
      type: object
      required:
        - titleKey
        - mediaType
        - "yes"
        - "no"
        - mySpicy
      properties:
        titleKey:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        "yes":
          type: integer
        "no":
          type: integer
        mySpicy:
          description: The current user's own answer, or null if they haven't answered.
          anyOf:
            - $ref: "#/components/schemas/Spicy"
            - type: "null"
    SpicyInput:
      type: object
      required:
        - title
        - mediaType
        - spicy
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        spicy:
          $ref: "#/components/schemas/Spicy"
        groupId:
          type: integer
          description: >-
            Scope the returned tallies to members of this group. Without it,
            only the caller's own answer is counted.
    CheckInResult:
      type: object
      required:
        - newCount
        - since
      properties:
        newCount:
          type: integer
          description: Entries added by other group members since the previous visit.
        since:
          type: ["string", "null"]
          format: date-time
          description: The previous last-seen time, or null on first visit.

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Watchlist entry operations
  - name: watchlist
    description: Personal watchlist (saved shows) operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List watchlist entries
      description: Returns all watchlist entries, optionally filtered by category or media type and sorted.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, rating_high, rating_low, title]
      responses:
        "200":
          description: A list of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a watchlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stats:
    get:
      operationId: getStats
      tags: [entries]
      summary: Watchlist summary stats
      description: Aggregate counts, average rating, category breakdown, and recent activity for the watchlist.
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
  /categories:
    get:
      operationId: listCategories
      tags: [entries]
      summary: List available categories
      description: Returns the canonical list of categories that can be assigned to entries.
      responses:
        "200":
          description: A list of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List my saved watchlist items
      description: >-
        Returns the current user's saved shows, each annotated with the names of
        other group members who have rated or saved the same show.
      responses:
        "200":
          description: A list of saved watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: createWatchlistItem
      tags: [watchlist]
      summary: Save a show to my watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
  /watchlist/{id}:
    delete:
      operationId: deleteWatchlistItem
      tags: [watchlist]
      summary: Remove a show from my watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activity/check-in:
    post:
      operationId: checkIn
      tags: [activity]
      summary: Record a visit and get new-activity count
      description: >-
        Records the current user's visit, returning the number of entries added
        by other group members since the user's previous visit. Updates the
        stored last-seen time to now.
      responses:
        "200":
          description: New-activity summary since the previous visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MediaType:
      type: string
      enum: [movie, tv]
    Entry:
      type: object
      required:
        - id
        - title
        - mediaType
        - rating
        - category
        - addedBy
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
        comment:
          type: ["string", "null"]
        addedBy:
          type: string
          description: Display name of the user who added this entry.
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required:
        - title
        - mediaType
        - rating
        - category
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: string
    EntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        category:
          type: string
          minLength: 1
        comment:
          type: ["string", "null"]
    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer
    Stats:
      type: object
      required:
        - total
        - movieCount
        - tvCount
        - averageRating
        - byCategory
      properties:
        total:
          type: integer
        movieCount:
          type: integer
        tvCount:
          type: integer
        averageRating:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    WatchlistItem:
      type: object
      required:
        - id
        - title
        - mediaType
        - createdAt
        - alsoEngagedBy
      properties:
        id:
          type: integer
        title:
          type: string
        mediaType:
          $ref: "#/components/schemas/MediaType"
        createdAt:
          type: string
          format: date-time
        alsoEngagedBy:
          type: array
          description: Display names of other group members who rated or saved this show.
          items:
            type: string
    WatchlistInput:
      type: object
      required:
        - title
        - mediaType
      properties:
        title:
          type: string
          minLength: 1
        mediaType:
          $ref: "#/components/schemas/MediaType"
    CheckInResult:
      type: object
      required:
        - newCount
        - since
      properties:
        newCount:
          type: integer
          description: Entries added by other group members since the previous visit.
        since:
          type: ["string", "null"]
          format: date-time
          description: The previous last-seen time, or null on first visit.
